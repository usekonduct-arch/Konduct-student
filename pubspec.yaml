name: konduct_student
description: "Konduct for students: pay campus rides with a scan."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_functions: ^6.5.0
  cloud_firestore: ^6.10.0
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  audioplayers: ^6.7.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
