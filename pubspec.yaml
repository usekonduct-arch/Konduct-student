name: konduct_student
description: "Konduct for students: pay campus rides with a scan."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_functions: ^6.5.0
  cloud_firestore: ^6.10.0
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  audioplayers: ^6.7.1
  qr_flutter: ^4.1.0
  firebase_messaging: ^16.7.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  share_plus: ^13.3.1
  pdf: ^3.12.0
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  firebase_crashlytics: ^5.4.0
  package_info_plus: ^10.2.2
  quick_actions: ^1.1.1
  home_widget: ^0.10.0
  app_links: ^7.0.0
  cached_network_image: ^3.4.1
  # Browser APIs for the web app (install prompt), used only in lib/app/pwa_web.dart.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/share/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
    # Fallback for letters the brand fonts lack: Yoruba ẹ ọ ṣ with tone marks, Hausa ɓ ɗ ƙ ƴ, and ₦.
    # A Latin subset of Noto Sans (SIL Open Font License, assets/fonts/NotoSans-OFL.txt).
    - family: NotoSansLatin
      fonts:
        - asset: assets/fonts/NotoSans-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-700.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-800.ttf
          weight: 800
    # The few symbols no brand font has: ⇄ on the bus's route board, and ★ ☆ in ratings. Bundled
    # (Noto, same licence) so a browser draws them the same as a phone, without fetching fonts.
    - family: NotoSansMath
      fonts:
        - asset: assets/fonts/NotoSansMath-400.ttf
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-400.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

dependency_overrides:
  # pdf 3.12 keeps archive below 4.1, but image 4.11.0 calls an archive 4.4 API while still
  # allowing 4.0, so it doesn't compile. Remove once pdf can move to 3.13+ (needs Dart 3.12).
  image: 4.10.2
